apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iom.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iom.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "iom.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iom.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # 等待 MySQL 就绪
        - name: wait-for-mysql
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "iom.mysql.host" . }} {{ include "iom.mysql.port" . }}; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is ready!"
        # 等待 Redis 就绪
        - name: wait-for-redis
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "iom.redis.host" . }} {{ include "iom.redis.port" . }}; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.httpPort }}
              protocol: TCP
          env:
            - name: iom_SERVER_MODE
              value: {{ .Values.server.mode | quote }}
            - name: iom_SERVER_HTTP_PORT
              value: {{ .Values.server.httpPort | quote }}
            - name: iom_SERVER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "iom.fullname" . }}-secrets
                  key: jwt-secret
            - name: iom_SERVER_JWT_EXPIRE
              value: {{ .Values.server.jwtExpire | quote }}
            - name: iom_DATABASE_HOST
              value: {{ include "iom.mysql.host" . | quote }}
            - name: iom_DATABASE_PORT
              value: {{ include "iom.mysql.port" . | quote }}
            - name: iom_DATABASE_DATABASE
              value: {{ include "iom.mysql.database" . | quote }}
            - name: iom_DATABASE_USERNAME
              {{- if .Values.mysql.enabled }}
              value: "root"
              {{- else }}
              value: {{ .Values.externalDatabase.username | quote }}
              {{- end }}
            - name: iom_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "iom.fullname" . }}-secrets
                  key: mysql-password
            - name: iom_REDIS_HOST
              value: {{ include "iom.redis.host" . | quote }}
            - name: iom_REDIS_PORT
              value: {{ include "iom.redis.port" . | quote }}
            - name: iom_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "iom.fullname" . }}-secrets
                  key: redis-password
            - name: iom_REDIS_DB
              {{- if .Values.redis.enabled }}
              value: "0"
              {{- else }}
              value: {{ .Values.externalRedis.db | quote }}
              {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iom.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iom.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "iom.backend.selectorLabels" . | nindent 4 }}
