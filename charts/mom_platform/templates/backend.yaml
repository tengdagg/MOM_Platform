apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mom.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mom.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "mom.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mom.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # 等待 MySQL 就绪
        - name: wait-for-mysql
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mom.mysql.host" . }} {{ include "mom.mysql.port" . }}; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is ready!"
        # 等待 Redis 就绪
        - name: wait-for-redis
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mom.redis.host" . }} {{ include "mom.redis.port" . }}; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
        {{- if and (not .Values.guacd.enabled) .Values.guacd.externalHost }}
        # 等待外部 guacd 就绪
        - name: wait-for-guacd
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.guacd.externalHost }} {{ .Values.guacd.externalPort }}; do
                echo "Waiting for external guacd..."
                sleep 2
              done
              echo "External guacd is ready!"
        {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.httpPort }}
              protocol: TCP
          env:
            - name: mom_SERVER_MODE
              value: {{ .Values.server.mode | quote }}
            - name: mom_SERVER_HTTP_PORT
              value: {{ .Values.server.httpPort | quote }}
            - name: mom_SERVER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mom.fullname" . }}-secrets
                  key: jwt-secret
            - name: MOM_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mom.fullname" . }}-secrets
                  key: credential-encryption-key
            - name: MOM_K8S_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mom.fullname" . }}-secrets
                  key: k8s-encryption-key
            - name: mom_SERVER_JWT_EXPIRE
              value: {{ .Values.server.jwtExpire | quote }}
            - name: mom_DATABASE_HOST
              value: {{ include "mom.mysql.host" . | quote }}
            - name: mom_DATABASE_PORT
              value: {{ include "mom.mysql.port" . | quote }}
            - name: mom_DATABASE_DATABASE
              value: {{ include "mom.mysql.database" . | quote }}
            - name: mom_DATABASE_USERNAME
              {{- if .Values.mysql.enabled }}
              value: "root"
              {{- else }}
              value: {{ .Values.externalDatabase.username | quote }}
              {{- end }}
            - name: mom_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mom.fullname" . }}-secrets
                  key: mysql-password
            - name: mom_REDIS_HOST
              value: {{ include "mom.redis.host" . | quote }}
            - name: mom_REDIS_PORT
              value: {{ include "mom.redis.port" . | quote }}
            - name: mom_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mom.fullname" . }}-secrets
                  key: redis-password
            - name: mom_REDIS_DB
              {{- if .Values.redis.enabled }}
              value: "0"
              {{- else }}
              value: {{ .Values.externalRedis.db | quote }}
              {{- end }}
            - name: mom_GUACD_HOST
              {{- if .Values.guacd.enabled }}
              value: "127.0.0.1"
              {{- else }}
              value: {{ .Values.guacd.externalHost | quote }}
              {{- end }}
            - name: mom_GUACD_PORT
              {{- if .Values.guacd.enabled }}
              value: {{ .Values.guacd.port | quote }}
              {{- else }}
              value: {{ .Values.guacd.externalPort | quote }}
              {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if and .Values.guacd.enabled .Values.guacd.drive.enabled }}
          volumeMounts:
            - name: guacd-drive
              mountPath: {{ .Values.guacd.drive.path }}
          {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
          {{- end }}
        {{- if .Values.guacd.enabled }}
        - name: guacd
          image: "{{ .Values.guacd.image.repository }}:{{ .Values.guacd.image.tag }}"
          imagePullPolicy: {{ .Values.guacd.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: guacd
              containerPort: {{ .Values.guacd.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.guacd.resources | nindent 12 }}
          {{- if .Values.guacd.drive.enabled }}
          volumeMounts:
            - name: guacd-drive
              mountPath: {{ .Values.guacd.drive.path }}
          {{- end }}
        {{- end }}
      {{- if and .Values.guacd.enabled .Values.guacd.drive.enabled }}
      volumes:
        - name: guacd-drive
          emptyDir:
            sizeLimit: {{ .Values.guacd.drive.sizeLimit }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mom.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mom.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mom.backend.selectorLabels" . | nindent 4 }}
