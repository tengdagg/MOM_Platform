# mom Helm Chart 配置文件
# 详细配置说明请参考 README.md

# ==================== 全局配置 ====================
global:
  # 存储类（留空使用默认）
  storageClass: ""
  # 镜像拉取策略
  imagePullPolicy: IfNotPresent
  # 镜像拉取密钥
  imagePullSecrets: []
  # busybox 镜像（用于 initContainer 等待依赖服务）
  busybox:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox
    tag: "1.37.0"

# ==================== 后端配置 ====================
backend:
  # 副本数
  replicaCount: 2

  image:
    repository: docker.1ms.run/dyclouds/mom-api
    tag: latest
    pullPolicy: Always

  # 服务配置
  service:
    type: ClusterIP
    port: 9876

  # 资源限制
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # 健康检查
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

  # 亲和性
  affinity: {}

# ==================== 前端配置 ====================
frontend:
  # 副本数
  replicaCount: 2

  image:
    repository: docker.1ms.run/dyclouds/mom-web
    tag: latest
    pullPolicy: Always

  # 服务配置
  service:
    type: ClusterIP
    port: 80

  # 资源限制
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  # 健康检查
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

  # 亲和性
  affinity: {}

# ==================== MySQL 配置 ====================
mysql:
  # 是否启用内置 MySQL（设为 false 使用外部数据库）
  enabled: true

  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql
    tag: "8.0.44"
    pullPolicy: IfNotPresent

  # 认证配置
  auth:
    rootPassword: "mom@2026"
    database: mom

  # 持久化存储
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # 资源限制
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

# ==================== Redis 配置 ====================
redis:
  # 是否启用内置 Redis（设为 false 使用外部 Redis）
  enabled: true

  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  # 认证配置
  auth:
    password: "mom@Redis"

  # 持久化存储
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

  # 资源限制
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

# ==================== 外部数据库配置 ====================
# 当 mysql.enabled=false 时使用
externalDatabase:
  host: ""
  port: 3306
  database: mom
  username: root
  password: ""

# ==================== 外部 Redis 配置 ====================
# 当 redis.enabled=false 时使用
externalRedis:
  host: ""
  port: 6379
  password: ""
  db: 0

# ==================== Guacd / RDP 配置 ====================
guacd:
  # 是否在 backend Pod 内启用 guacd sidecar
  # 启用后用于 Windows RDP 远程桌面代理，backend 将通过 127.0.0.1:4822 连接 guacd
  enabled: true

  image:
    repository: registry.cn-hangzhou.aliyuncs.com/registry_dat/guacd
    tag: latest
    pullPolicy: IfNotPresent

  # guacd 监听端口
  port: 4822

  # 当 enabled=false 时，使用外部 guacd 地址
  externalHost: ""
  externalPort: 4822

  # RDP 文件传输目录，需与 backend 共享
  drive:
    enabled: true
    path: /tmp/guacd-drive
    sizeLimit: 512Mi

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "300m"

# ==================== 服务器配置 ====================
server:
  # 运行模式: debug / release
  mode: release
  # HTTP 端口
  httpPort: 9876
  # JWT 密钥（生产环境请修改为随机字符串）
  jwtSecret: "mom-jwt-secret-key-please-change-in-production"
  # JWT 过期时间
  jwtExpire: "24h"

# ==================== 安全配置 ====================
security:
  # 资产凭据加解密密钥，必须为 32 字节；未显式填写时默认使用历史兼容值
  credentialEncryptionKey: "mom-encrypt-key-32bytes-long!!@@"
  # Kubernetes kubeconfig 加解密密钥，必须为 32 字节；未显式填写时默认使用历史兼容值
  k8sEncryptionKey: "mom-k8s-encrypt-key-32byte!!@@!!"

# ==================== Ingress 配置 ====================
ingress:
  # 是否启用 Ingress
  enabled: false
  # Ingress 类名
  className: nginx
  # 注解
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket 支持
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  # 主机配置
  hosts:
    - host: mom.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS 配置
  tls: []
  # - secretName: mom-tls
  #   hosts:
  #     - mom.example.com

# ==================== ServiceMonitor 配置 ====================
# Prometheus Operator 监控
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  namespace: ""

# ==================== Pod 中断预算 ====================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ==================== 水平自动扩缩 ====================
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
