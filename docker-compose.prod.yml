version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0.44
    container_name: mom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mom@2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mom}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mom-network

  # Redis 缓存
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    container_name: mom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mom-network

  # 后端服务
  backend:
    image: docker.1ms.run/dyclouds/mom-api:latest
    container_name: mom-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      mom_SERVER_MODE: ${mom_SERVER_MODE:-release}
      mom_SERVER_HTTP_PORT: 9876
      mom_SERVER_JWT_SECRET: ${mom_SERVER_JWT_SECRET:-mom-jwt-secret-change-in-production}
      mom_SERVER_JWT_EXPIRE: 24h
      mom_DATABASE_HOST: mysql
      mom_DATABASE_PORT: 3306
      mom_DATABASE_DATABASE: ${MYSQL_DATABASE:-mom}
      mom_DATABASE_USERNAME: ${MYSQL_USERNAME:-root}
      mom_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mom@2026}
      mom_REDIS_HOST: redis
      mom_REDIS_PORT: 6379
      mom_REDIS_PASSWORD: ""
      mom_REDIS_DB: 0
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - mom-network

  # Guacamole 代理守护进程 (用于 Windows RDP 远程连接)
  guacd:
    image: guacamole/guacd:latest
    container_name: mom-guacd
    restart: unless-stopped
    tmpfs:
      - /tmp/guacd-drive:size=512M
    networks:
      - mom-network

  # 前端服务 (Nginx)
  frontend:
    image: docker.1ms.run/dyclouds/mom-web:latest
    container_name: mom-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mom-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  mom-network:
    driver: bridge
