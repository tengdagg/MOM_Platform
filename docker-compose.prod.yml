version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0.44
    container_name: iom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-iom@2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iom}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iom-network

  # Redis 缓存
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    container_name: iom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iom-network

  # 后端服务
  backend:
    image: docker.1ms.run/dyclouds/iom-api:latest
    container_name: iom-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      iom_SERVER_MODE: ${iom_SERVER_MODE:-release}
      iom_SERVER_HTTP_PORT: 9876
      iom_SERVER_JWT_SECRET: ${iom_SERVER_JWT_SECRET:-iom-jwt-secret-change-in-production}
      iom_SERVER_JWT_EXPIRE: 24h
      iom_DATABASE_HOST: mysql
      iom_DATABASE_PORT: 3306
      iom_DATABASE_DATABASE: ${MYSQL_DATABASE:-iom}
      iom_DATABASE_USERNAME: ${MYSQL_USERNAME:-root}
      iom_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-iom@2026}
      iom_REDIS_HOST: redis
      iom_REDIS_PORT: 6379
      iom_REDIS_PASSWORD: ""
      iom_REDIS_DB: 0
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - iom-network

  # 前端服务 (Nginx)
  frontend:
    image: docker.1ms.run/dyclouds/iom-web:latest
    container_name: iom-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iom-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  iom-network:
    driver: bridge
