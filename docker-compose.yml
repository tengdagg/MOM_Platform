

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0.44
    container_name: mom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mom}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:-123456} || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - mom-network

  # Redis 缓存
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    container_name: mom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - mom-network

  # 后端服务
  backend:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    image: registry.cn-hangzhou.aliyuncs.com/registry_dat/mom_platform:latest
    container_name: mom-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      MOM_SERVER_MODE: ${MOM_SERVER_MODE:-release}
      MOM_SERVER_HTTP_PORT: 9876
      MOM_SERVER_JWT_SECRET: ${MOM_SERVER_JWT_SECRET:-your-secret-key-change-in-production}
      # 资产凭据加解密密钥，必须为 32 字节；未填写时默认使用历史兼容值
      MOM_CREDENTIAL_ENCRYPTION_KEY: ${MOM_CREDENTIAL_ENCRYPTION_KEY:-mom-encrypt-key-32bytes-long!!@@}
      # Kubernetes kubeconfig 加解密密钥，必须为 32 字节；未填写时默认使用历史兼容值
      MOM_K8S_ENCRYPTION_KEY: ${MOM_K8S_ENCRYPTION_KEY:-mom-k8s-encrypt-key-32byte!!@@!!}
      MOM_DATABASE_HOST: mysql
      MOM_DATABASE_PORT: 3306
      MOM_DATABASE_DATABASE: ${MYSQL_DATABASE:-mom}
      MOM_DATABASE_USERNAME: ${MYSQL_USERNAME:-root}
      MOM_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MOM_REDIS_HOST: redis
      MOM_REDIS_PORT: 6379
      MOM_REDIS_PASSWORD: ""
      MOM_GUACD_HOST: guacd
      MOM_GUACD_PORT: 4822
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      guacd:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - mom-network

  # Guacamole 代理守护进程 (用于 Windows RDP 远程连接)
  guacd:
    image: registry.cn-hangzhou.aliyuncs.com/registry_dat/guacd:latest
    container_name: mom-guacd
    restart: unless-stopped
    ports:
      - "${GUACD_PORT:-4822}:4822"
    tmpfs:
      - /tmp/guacd-drive:size=512M
    networks:
      - mom-network

  # 前端服务（nginx 静态文件服务）
  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/registry_dat/mom_platform_front:latest
    container_name: mom-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - mom-network

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/mysql-data  # 修改为你想要的路径
      o: bind
  redis-data:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/redis-data  # 修改为你想要的路径
      o: bind

networks:
  mom-network:
    driver: bridge