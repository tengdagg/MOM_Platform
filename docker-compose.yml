

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0.44
    container_name: mom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mom}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - mom-network

  # Redis 缓存
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    container_name: mom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - mom-network

  # 后端服务 (开发模式)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mom-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      mom_SERVER_MODE: ${mom_SERVER_MODE:-debug}
      mom_SERVER_HTTP_PORT: 9876
      mom_SERVER_JWT_SECRET: ${mom_SERVER_JWT_SECRET:-your-secret-key-change-in-production}
      mom_DATABASE_HOST: mysql
      mom_DATABASE_PORT: 3306
      mom_DATABASE_DATABASE: ${MYSQL_DATABASE:-mom}
      mom_DATABASE_USERNAME: ${MYSQL_USERNAME:-root}
      mom_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      mom_REDIS_HOST: redis
      mom_REDIS_PORT: 6379
      mom_REDIS_PASSWORD: ""
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      - mysql
      - redis
      - guacd
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - mom-network

  # Guacamole 代理守护进程 (用于 Windows RDP 远程连接)
  guacd:
    image: guacamole/guacd:latest
    container_name: mom-guacd
    restart: unless-stopped
    ports:
      - "${GUACD_PORT:-4822}:4822"
    tmpfs:
      - /tmp/guacd-drive:size=512M
    networks:
      - mom-network

  # 前端服务
  frontend:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:20-alpine
    container_name: mom-frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://backend:9876
    depends_on:
      - backend
    networks:
      - mom-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  mom-network:
    driver: bridge
